<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="50%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#040404" />
    </linearGradient>
    <radialGradient id="subGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="subGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1c1c1c" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="520" fill="url(#subGrad)" />
  <rect width="800" height="520" fill="url(#subGrid)" opacity="0.6" />
  <rect width="800" height="520" fill="url(#subGlow)" />

  <!-- Industrial Silhouette: Power Transformers & Pylons (Grayscale Monochrome) -->
  <g fill="#1a1a1a" stroke="#383838" stroke-width="1.2">
    <!-- Transmission Pylon Left -->
    <path d="M 120,420 L 140,120 L 160,120 L 180,420 Z" />
    <line x1="100" y1="180" x2="200" y2="180" stroke="#484848" stroke-width="1.5" />
    <line x1="110" y1="240" x2="190" y2="240" stroke="#484848" stroke-width="1.5" />
    <line x1="120" y1="310" x2="180" y2="310" stroke="#484848" stroke-width="1.5" />
    <!-- Lattice Bracing -->
    <line x1="135" y1="180" x2="165" y2="240" stroke="#333333" />
    <line x1="165" y1="180" x2="135" y2="240" stroke="#333333" />
    <line x1="130" y1="240" x2="170" y2="310" stroke="#333333" />
    <line x1="170" y1="240" x2="130" y2="310" stroke="#333333" />

    <!-- Center High-Voltage Power Transformer Unit -->
    <rect x="280" y="240" width="240" height="180" fill="#141414" stroke="#484848" stroke-width="1.5" />
    <rect x="300" y="260" width="200" height="140" fill="#0d0d0d" stroke="#303030" stroke-width="1" />
    <!-- Cooling Fins -->
    <line x1="320" y1="270" x2="320" y2="390" stroke="#404040" stroke-width="2" />
    <line x1="340" y1="270" x2="340" y2="390" stroke="#404040" stroke-width="2" />
    <line x1="360" y1="270" x2="360" y2="390" stroke="#404040" stroke-width="2" />
    <line x1="380" y1="270" x2="380" y2="390" stroke="#404040" stroke-width="2" />
    <line x1="400" y1="270" x2="400" y2="390" stroke="#404040" stroke-width="2" />
    <line x1="420" y1="270" x2="420" y2="390" stroke="#404040" stroke-width="2" />
    <line x1="440" y1="270" x2="440" y2="390" stroke="#404040" stroke-width="2" />
    <line x1="460" y1="270" x2="460" y2="390" stroke="#404040" stroke-width="2" />
    <line x1="480" y1="270" x2="480" y2="390" stroke="#404040" stroke-width="2" />

    <!-- Bushings (Ceramic Insulators on top of Transformer) -->
    <rect x="325" y="160" width="30" height="80" fill="#202020" stroke="#505050" />
    <circle cx="340" cy="150" r="14" fill="#2c2c2c" stroke="#666666" />
    
    <rect x="385" y="140" width="30" height="100" fill="#202020" stroke="#505050" />
    <circle cx="400" cy="130" r="14" fill="#2c2c2c" stroke="#666666" />

    <rect x="445" y="160" width="30" height="80" fill="#202020" stroke="#505050" />
    <circle cx="460" cy="150" r="14" fill="#2c2c2c" stroke="#666666" />

    <!-- Right Side Switchgear & Circuit Breakers -->
    <rect x="580" y="280" width="140" height="140" fill="#141414" stroke="#484848" />
    <line x1="610" y1="210" x2="610" y2="280" stroke="#555555" stroke-width="3" />
    <circle cx="610" cy="205" r="10" fill="#222222" stroke="#666666" />
    <line x1="690" y1="210" x2="690" y2="280" stroke="#555555" stroke-width="3" />
    <circle cx="690" cy="205" r="10" fill="#222222" stroke="#666666" />

    <!-- Overhead High-Voltage Conductor Lines -->
    <path d="M 0,110 Q 150,170 340,150 T 610,130 T 800,160" fill="none" stroke="#555555" stroke-width="1.2" />
    <path d="M 0,130 Q 150,190 400,130 T 690,140 T 800,180" fill="none" stroke="#666666" stroke-width="1.2" />
    <path d="M 0,150 Q 150,210 460,150 T 750,150 T 800,200" fill="none" stroke="#555555" stroke-width="1.2" />
  </g>

  <!-- Technical Overlay Box: AI Diagnostic Telemetry (Restrained Violet Accent) -->
  <g transform="translate(40, 360)">
    <rect width="320" height="120" fill="#080808" stroke="#333333" stroke-width="1" />
    <rect width="320" height="26" fill="#121212" stroke="#222222" stroke-width="1" />
    <text x="12" y="17" font-family="'Courier New', monospace" font-size="10" fill="#a0a0a0" letter-spacing="1">PRJ_232 // SUBSTATION_AI_RAG</text>
    <circle cx="304" cy="13" r="4" fill="#8B5CF6" />

    <text x="12" y="48" font-family="'Courier New', monospace" font-size="10" fill="#F5F5F5">INPUT: 400kV TRANSFORMER #02 TRIP</text>
    <text x="12" y="68" font-family="'Courier New', monospace" font-size="10" fill="#8B5CF6">RETRIEVAL: SOP_MANUAL §14.8 [0.984]</text>
    <text x="12" y="88" font-family="'Courier New', monospace" font-size="10" fill="#A0A0A0">STATUS: RELAY TRIP FAULT CLASSIFIED</text>
    <text x="12" y="106" font-family="'Courier New', monospace" font-size="9" fill="#707070">FASTAPI + LANGGRAPH + QDRANT HYBRID</text>
  </g>

  <!-- Frame Border Details -->
  <rect x="15" y="15" width="770" height="490" fill="none" stroke="#282828" stroke-width="1" />
  <path d="M 15,35 L 15,15 L 35,15" fill="none" stroke="#8B5CF6" stroke-width="2" />
  <path d="M 785,35 L 785,15 L 765,15" fill="none" stroke="#8B5CF6" stroke-width="2" />
</svg>
