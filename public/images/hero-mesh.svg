<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1c" />
      <stop offset="50%" stop-color="#0e0e0e" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <radialGradient id="meshSpot" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="fineGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222222" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" fill="url(#meshGrad)" />
  <rect width="800" height="1000" fill="url(#fineGrid)" opacity="0.65" />
  <circle cx="400" cy="420" r="380" fill="url(#meshSpot)" />

  <!-- Abstract 3D Geometric Mesh / Wireframe Terrain -->
  <g stroke="#404040" stroke-width="1" fill="none" opacity="0.85">
    <!-- Horizontal Perspective Curves -->
    <path d="M 50,300 Q 200,240 400,280 T 750,320" stroke="#505050" />
    <path d="M 50,340 Q 200,270 400,320 T 750,370" stroke="#606060" />
    <path d="M 50,390 Q 220,310 400,370 T 750,430" stroke="#707070" />
    <path d="M 50,450 Q 230,360 400,430 T 750,500" stroke="#808080" />
    <path d="M 50,520 Q 240,420 400,500 T 750,580" stroke="#909090" />
    <path d="M 50,600 Q 250,500 400,580 T 750,670" stroke="#a0a0a0" />
    <path d="M 50,690 Q 260,590 400,670 T 750,770" stroke="#b0b0b0" />
    <path d="M 50,790 Q 280,700 400,770 T 750,880" stroke="#c0c0c0" stroke-width="1.25" />

    <!-- Vertical Transversal Lines -->
    <path d="M 120,290 C 130,450 140,650 150,830" stroke="#484848" />
    <path d="M 200,270 C 215,440 230,640 250,820" stroke="#555555" />
    <path d="M 280,260 C 295,430 320,630 350,810" stroke="#666666" />
    <path d="M 360,270 C 375,440 405,640 440,810" stroke="#777777" />
    <path d="M 440,290 C 455,450 485,650 530,810" stroke="#666666" />
    <path d="M 520,300 C 535,460 565,660 610,810" stroke="#555555" />
    <path d="M 600,310 C 615,470 645,670 690,820" stroke="#484848" />
    <path d="M 680,315 C 695,475 715,675 750,820" stroke="#3d3d3d" />
  </g>

  <!-- High-Density Particle Constellations -->
  <g fill="#d4d4d4">
    <circle cx="280" cy="260" r="3" />
    <circle cx="360" cy="270" r="3.5" />
    <circle cx="440" cy="290" r="3" />
    <circle cx="215" cy="440" r="3.5" />
    <circle cx="295" cy="430" r="4" fill="#ffffff" />
    <circle cx="375" cy="440" r="4.5" fill="#8B5CF6" />
    <circle cx="455" cy="450" r="4" fill="#ffffff" />
    <circle cx="535" cy="460" r="3.5" />
    <circle cx="230" cy="640" r="3.5" />
    <circle cx="320" cy="630" r="4" fill="#ffffff" />
    <circle cx="405" cy="640" r="4.5" fill="#8B5CF6" />
    <circle cx="485" cy="650" r="4" fill="#ffffff" />
    <circle cx="565" cy="660" r="3" />
  </g>

  <!-- Digital Coordinate Crosshairs and Technical Markers -->
  <g stroke="#666666" stroke-width="1">
    <line x1="390" y1="440" x2="410" y2="440" />
    <line x1="400" y1="430" x2="400" y2="450" />
    
    <line x1="365" y1="640" x2="385" y2="640" />
    <line x1="375" y1="630" x2="375" y2="650" />
  </g>

  <!-- Technical Telemetry Typography -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#737373" letter-spacing="2">
    <text x="50" y="80">SYS_VIEW // DIGITAL_MESH_01</text>
    <text x="50" y="105">TOPOLOGY: ADAPTIVE_POLY_SURFACE</text>
    <text x="50" y="130">GRID_RESOLUTION: 64x64_FLOAT</text>
    <text x="750" y="80" text-anchor="end">LOC: 12.9716°N / 77.5946°E</text>
    <text x="750" y="105" text-anchor="end">STATUS: COMPUTING</text>
    
    <text x="50" y="930">FRAME_BUFFER // 0x4F92A</text>
    <text x="50" y="955">LATENCY: 1.2ms [REALTIME]</text>
    <text x="750" y="955" text-anchor="end" fill="#8B5CF6">RENDER: MONOCHROME</text>
  </g>

  <!-- Outer Technical Bounding Border -->
  <rect x="25" y="25" width="750" height="950" fill="none" stroke="#262626" stroke-width="1" />
  <path d="M 25,45 L 25,25 L 45,25" fill="none" stroke="#8B5CF6" stroke-width="2" />
  <path d="M 775,45 L 775,25 L 755,25" fill="none" stroke="#8B5CF6" stroke-width="2" />
  <path d="M 25,955 L 25,975 L 45,975" fill="none" stroke="#8B5CF6" stroke-width="2" />
  <path d="M 775,955 L 775,975 L 755,975" fill="none" stroke="#8B5CF6" stroke-width="2" />
</svg>
