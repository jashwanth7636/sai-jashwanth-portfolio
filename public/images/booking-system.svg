<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="50%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#040404" />
    </linearGradient>
    <radialGradient id="bookGlow" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="bookGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a1a1a" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="520" fill="url(#bookGrad)" />
  <rect width="800" height="520" fill="url(#bookGrid)" opacity="0.6" />
  <rect width="800" height="520" fill="url(#bookGlow)" />

  <!-- Main Application Window Frame -->
  <g transform="translate(60, 45)">
    <!-- Outer Window Canvas -->
    <rect width="680" height="430" fill="#0d0d0d" stroke="#333333" stroke-width="1.5" />
    
    <!-- Titlebar & Navigation -->
    <rect width="680" height="38" fill="#141414" stroke="#262626" stroke-width="1" />
    <circle cx="20" cy="19" r="5" fill="#303030" />
    <circle cx="36" cy="19" r="5" fill="#303030" />
    <circle cx="52" cy="19" r="5" fill="#8B5CF6" />
    
    <text x="80" y="23" font-family="'Courier New', monospace" font-size="11" fill="#f0f0f0" font-weight="bold">SMART SERVICE BOOKING SYSTEM</text>
    <text x="660" y="23" font-family="'Courier New', monospace" font-size="10" fill="#8B5CF6" text-anchor="end">TOMCAT 9 // MYSQL ACTIVE</text>

    <!-- Subheader with Service Selection -->
    <g transform="translate(24, 56)">
      <text x="0" y="15" font-family="'Courier New', monospace" font-size="10" fill="#707070">SELECT SERVICE CATEGORY:</text>
      
      <rect x="0" y="26" width="180" height="32" fill="#181818" stroke="#333333" />
      <text x="14" y="47" font-family="'Courier New', monospace" font-size="10" fill="#f0f0f0">EQUIPMENT INSPECTION</text>

      <rect x="190" y="26" width="180" height="32" fill="#121212" stroke="#222222" />
      <text x="204" y="47" font-family="'Courier New', monospace" font-size="10" fill="#888888">DIAGNOSTIC AUDIT</text>

      <rect x="380" y="26" width="180" height="32" fill="#121212" stroke="#222222" />
      <text x="394" y="47" font-family="'Courier New', monospace" font-size="10" fill="#888888">CIRCUIT TESTING</text>
    </g>

    <!-- Calendar Date Picker (Left) & Slot Matrix (Right) -->
    <!-- Calendar Column -->
    <g transform="translate(24, 134)">
      <rect width="260" height="210" fill="#121212" stroke="#282828" />
      <rect width="260" height="30" fill="#181818" />
      <text x="14" y="20" font-family="'Courier New', monospace" font-size="10" fill="#f0f0f0">DATE: OCTOBER 2026</text>
      
      <!-- Mini Calendar Grid -->
      <g font-family="'Courier New', monospace" font-size="9" fill="#666666" text-anchor="middle">
        <text x="25" y="48">MO</text><text x="60" y="48">TU</text><text x="95" y="48">WE</text>
        <text x="130" y="48">TH</text><text x="165" y="48">FR</text><text x="200" y="48">SA</text><text x="235" y="48">SU</text>

        <text x="25" y="78">12</text><text x="60" y="78">13</text><text x="95" y="78">14</text>
        <text x="130" y="78">15</text><text x="165" y="78">16</text><text x="200" y="78">17</text><text x="235" y="78">18</text>

        <!-- Selected Date (18th) with Violet Border -->
        <rect x="80" y="94" width="30" height="22" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" />
        <text x="95" y="109" fill="#ffffff" font-weight="bold">19</text>
        <text x="130" y="109" fill="#aaaaaa">20</text><text x="165" y="109" fill="#aaaaaa">21</text>
        <text x="200" y="109" fill="#aaaaaa">22</text><text x="235" y="109" fill="#aaaaaa">23</text>
        <text x="25" y="109" fill="#aaaaaa">24</text><text x="60" y="109" fill="#aaaaaa">25</text>
      </g>

      <text x="14" y="190" font-family="'Courier New', monospace" font-size="9" fill="#8B5CF6">FLATPICKR COMPONENT SYNCED</text>
    </g>

    <!-- Time Slot Matrix Column -->
    <g transform="translate(304, 134)">
      <rect width="352" height="210" fill="#121212" stroke="#282828" />
      <rect width="352" height="30" fill="#181818" />
      <text x="14" y="20" font-family="'Courier New', monospace" font-size="10" fill="#f0f0f0">AVAILABLE TIME SLOTS</text>
      <text x="338" y="20" font-family="'Courier New', monospace" font-size="9" fill="#888888" text-anchor="end">DOUBLE-BOOKING: BLOCKED</text>

      <!-- Slot Matrix Grid 2x3 -->
      <g transform="translate(14, 46)">
        <!-- Slot 1 - Booked -->
        <rect x="0" y="0" width="100" height="42" fill="#0c0c0c" stroke="#222222" opacity="0.4" />
        <text x="10" y="22" font-family="'Courier New', monospace" font-size="10" fill="#555555">09:00 AM</text>
        <text x="10" y="34" font-family="'Courier New', monospace" font-size="7" fill="#444444">BOOKED</text>

        <!-- Slot 2 - Available -->
        <rect x="112" y="0" width="100" height="42" fill="#181818" stroke="#333333" />
        <text x="122" y="22" font-family="'Courier New', monospace" font-size="10" fill="#f0f0f0">10:30 AM</text>
        <text x="122" y="34" font-family="'Courier New', monospace" font-size="7" fill="#8B5CF6">AVAILABLE</text>

        <!-- Slot 3 - Booked -->
        <rect x="224" y="0" width="100" height="42" fill="#0c0c0c" stroke="#222222" opacity="0.4" />
        <text x="234" y="22" font-family="'Courier New', monospace" font-size="10" fill="#555555">12:00 PM</text>
        <text x="234" y="34" font-family="'Courier New', monospace" font-size="7" fill="#444444">BOOKED</text>

        <!-- Slot 4 - Selected (Active Violet) -->
        <rect x="0" y="52" width="100" height="42" fill="#1e1830" stroke="#8B5CF6" stroke-width="1.5" />
        <text x="10" y="74" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" font-weight="bold">02:00 PM</text>
        <text x="10" y="86" font-family="'Courier New', monospace" font-size="7" fill="#8B5CF6">CHOSEN</text>

        <!-- Slot 5 - Available -->
        <rect x="112" y="52" width="100" height="42" fill="#181818" stroke="#333333" />
        <text x="122" y="74" font-family="'Courier New', monospace" font-size="10" fill="#f0f0f0">03:30 PM</text>
        <text x="122" y="86" font-family="'Courier New', monospace" font-size="7" fill="#8B5CF6">AVAILABLE</text>

        <!-- Slot 6 - Available -->
        <rect x="224" y="52" width="100" height="42" fill="#181818" stroke="#333333" />
        <text x="234" y="74" font-family="'Courier New', monospace" font-size="10" fill="#f0f0f0">05:00 PM</text>
        <text x="234" y="86" font-family="'Courier New', monospace" font-size="7" fill="#8B5CF6">AVAILABLE</text>
      </g>

      <!-- Action Button -->
      <rect x="14" y="156" width="324" height="38" fill="#8B5CF6" />
      <text x="176" y="180" font-family="'Courier New', monospace" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">RESERVE SLOT [02:00 PM] &#8594;</text>
    </g>

    <!-- Footer Bar -->
    <rect y="392" width="680" height="38" fill="#141414" stroke="#222222" />
    <text x="24" y="416" font-family="'Courier New', monospace" font-size="9" fill="#707070">BACKEND: JAVA SERVLETS (MVC) &#8226; PERSISTENCE: JDBC / MYSQL &#8226; UI: BOOTSTRAP 5</text>
  </g>

  <!-- Frame Outline Corners -->
  <rect x="15" y="15" width="770" height="490" fill="none" stroke="#282828" stroke-width="1" />
  <path d="M 15,35 L 15,15 L 35,15" fill="none" stroke="#8B5CF6" stroke-width="2" />
  <path d="M 785,35 L 785,15 L 765,15" fill="none" stroke="#8B5CF6" stroke-width="2" />
</svg>
